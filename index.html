<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>DATABEND - Audio Designer (Glitch Progress)</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#121212;color:#e0e0e0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
.app{height:100%;display:grid;grid-template-rows:60px 1fr 60px;gap:0}

/* Header */
.header{background:#1a1a1a;border-bottom:1px solid #333;padding:16px 24px;display:flex;align-items:center;justify-content:space-between}
.logo{font-size:18px;font-weight:600;letter-spacing:1px}
.header-right{display:flex;gap:16px;align-items:center;font-size:12px;color:#888}

/* Main */
.main{display:grid;grid-template-columns:1fr 340px;gap:0;overflow:hidden}

/* Canvas */
.canvas-area{background:#0a0a0a;position:relative;overflow:hidden;border-right:1px solid #333}
#canvas{width:100%;height:100%;display:block}

/* Glitch progress band (bottom) */
#glitchProgressWrap{
  position:absolute;
  left:0;
  right:0;
  bottom:8px;
  height:60px;
  display:flex;
  align-items:center;
  justify-content:center;
  pointer-events:none;
  z-index:20;
}
#glitchProgress{
  pointer-events:auto;
  width:92%;
  max-width:1200px;
  height:44px;
  background:linear-gradient(90deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
  border:1px solid rgba(255,255,255,0.04);
  border-radius:6px;
  padding:6px 10px;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  box-shadow:0 4px 18px rgba(0,0,0,0.6);
  opacity:0;
  transform:translateY(10px);
  transition:opacity .16s ease, transform .18s cubic-bezier(.2,.9,.3,1);
  font-family: "Courier New", Menlo, monospace;
  color:#cfeeea;
  will-change:opacity, transform;
}

/* visible state */
#glitchProgress.show{opacity:1;transform:translateY(0);}

/* bar and label layout */
.progress-bar {
  white-space:nowrap;
  font-size:16px;
  letter-spacing:0.5px;
  display:inline-block;
  padding-right:10px;
  user-select:none;
}
.progress-label {
  position:relative;
  display:inline-block;
  margin-left:8px;
  font-size:14px;
  color:#e6f9f7;
  user-select:none;
  pointer-events:none;
}

/* RGB split layers for flicker: three stacked spans */
.progress-label .layer{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  white-space:nowrap;
  opacity:0.9;
  mix-blend-mode:screen;
}
.progress-label .layer.base{ color:#e6f9f7; filter: none; }
.progress-label .layer.r{ color:#ff8b8b; transform:translate(calc(-50% + 1px),calc(-50% + 0px)); opacity:0.84; }
.progress-label .layer.g{ color:#8bffde; transform:translate(calc(-50% - 1px),calc(-50% - 0px)); opacity:0.72; }

/* subtle scanline background */
#glitchProgress::before{
  content:'';
  position:absolute;
  left:0;right:0;top:0;bottom:0;
  background-image:linear-gradient(rgba(255,255,255,0.01) 1px, transparent 1px);
  background-size:100% 3px;
  pointer-events:none;
  mix-blend-mode:overlay;
}

/* pulsate animation when active */
@keyframes progressPulse {
  0% { opacity: 0.96; transform: translateY(0) scale(1); }
  50% { opacity: 1; transform: translateY(-0.6px) scale(1.002); }
  100% { opacity: 0.96; transform: translateY(0) scale(1); }
}
#glitchProgress.active { animation: progressPulse 900ms infinite; }

/* white flash on completion */
.flash {
  position:absolute;
  left:0;right:0;top:0;bottom:0;
  pointer-events:none;
  background:rgba(255,255,255,0.0);
  mix-blend-mode:screen;
}

/* Right Panel */
.panel{background:#1a1a1a;border-left:1px solid #333;display:grid;grid-template-rows:auto 1fr auto;gap:0;overflow:hidden}
.panel-header{padding:16px;border-bottom:1px solid #333;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:0.5px;color:#999}
.panel-content{overflow-y:auto;padding:16px}
.panel-content::-webkit-scrollbar{width:6px}
.panel-content::-webkit-scrollbar-track{background:transparent}
.panel-content::-webkit-scrollbar-thumb{background:#333;border-radius:3px}

/* Controls */
.section{margin-bottom:20px}
.section-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;color:#999;margin-bottom:10px}
.control-label{font-size:11px;color:#999;margin-bottom:6px;display:block;text-transform:uppercase;letter-spacing:0.5px}

/* Buttons */
.btn{padding:10px 14px;background:#0d7377;border:none;color:#fff;font-size:12px;font-weight:600;border-radius:4px;cursor:pointer;transition:all 0.2s;text-transform:uppercase;letter-spacing:0.5px}
.btn:hover{background:#14a085}
.btn:active{transform:scale(0.98)}
.btn-group{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.btn-danger{background:#d32f2f}
.btn-danger:hover{background:#f32c1e}
.btn-secondary{background:#424242}
.btn-secondary:hover{background:#505050}

/* Display */
.display{background:#242424;border:1px solid #333;padding:8px;border-radius:4px;font-size:11px;color:#aaa;font-family:monospace}
.display-value{color:#0d7377;font-weight:600}

/* Footer buttons */
.panel-footer{display:flex;gap:8px;padding:12px;border-top:1px solid #333}
.footer-btn{flex:1;padding:8px;background:#242424;border:1px solid #333;color:#e0e0e0;font-size:11px;font-weight:600;border-radius:4px;cursor:pointer;transition:all 0.2s}
.footer-btn:hover{background:#2a2a2a;border-color:#444}
.footer-btn:active{transform:scale(0.95)}
.footer-btn.primary{background:#0d7377;color:#fff;border-color:#0d7377}
.footer-btn.primary:hover{background:#14a085}

/* Inputs */
input[type="range"]{width:100%;height:4px;background:#2a2a2a;border:none;border-radius:2px;-webkit-appearance:none;cursor:pointer}
input[type="range"]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;background:#0d7377;border-radius:50%;cursor:pointer}
input[type="number"]{width:100%;padding:8px;background:#242424;border:1px solid #333;color:#e0e0e0;font-size:12px;border-radius:4px}
select{width:100%;padding:8px;background:#242424;border:1px solid #333;color:#e0e0e0;font-size:12px;border-radius:4px}
input[type="text"]{width:100%;padding:8px;background:#242424;border:1px solid #333;color:#e0e0e0;font-size:12px;border-radius:4px}

/* Small notes */
.note{font-size:11px;color:#888;margin-top:8px}
</style>
</head>
<body>
<div class="app">
  <!-- Header -->
  <div class="header">
    <div class="logo">DATABEND</div>
    <div class="header-right">
      <span id="status">Ready</span>
    </div>
  </div>

  <!-- Main -->
  <div class="main">
    <!-- Canvas -->
    <div class="canvas-area">
      <canvas id="canvas"></canvas>

      <!-- Glitch Progress Band -->
      <div id="glitchProgressWrap" aria-hidden="true">
        <div id="glitchProgress" role="status" aria-live="polite">
          <div class="progress-bar" id="progressBar"></div>
          <div class="progress-label" id="progressLabel">
            <span class="layer r" id="labelR"></span>
            <span class="layer g" id="labelG"></span>
            <span class="layer base" id="labelBase"></span>
          </div>
          <div class="flash" id="progressFlash" style="display:none"></div>
        </div>
      </div>

    </div>

    <!-- Panel -->
    <div class="panel">
      <div class="panel-header">Controls</div>

      <div class="panel-content">
        <!-- File -->
        <div class="section">
          <div class="section-title">File</div>
          <button class="btn" id="loadBtn" style="width:100%">Load Audio</button>
          <div class="display" id="fileInfo" style="margin-top:8px">No file loaded</div>
        </div>

        <!-- Databend -->
        <div class="section">
          <div class="section-title">Databend</div>

          <div class="control">
            <label class="control-label">Intensity</label>
            <div class="control-value"><span id="intensityVal">50</span>%</div>
            <input type="range" id="intensity" min="0" max="100" value="50">
          </div>

          <div class="btn-group">
            <button class="btn" id="bitcrushBtn">BitCrush</button>
            <button class="btn" id="foldBtn">Fold</button>
          </div>
          <div class="btn-group" style="margin-top:8px">
            <button class="btn" id="shiftBtn">Shift</button>
            <button class="btn" id="invertBtn">Invert</button>
          </div>
          <div class="btn-group" style="margin-top:8px">
            <button class="btn" id="randomBtn">Random</button>
            <button class="btn btn-danger" id="corruptBtn">Corrupt</button>
          </div>
        </div>

        <!-- Glitch -->
        <div class="section">
          <div class="section-title">Glitch</div>

          <div class="control">
            <label class="control-label">Chunk Size</label>
            <input type="number" id="chunkSize" value="512" min="4" step="4">
          </div>

          <div class="btn-group">
            <button class="btn" id="granularBtn">Granular</button>
            <button class="btn" id="stutterBtn">Stutter</button>
          </div>
          <div class="btn-group" style="margin-top:8px">
            <button class="btn" id="reverseBtn">Reverse</button>
            <button class="btn" id="scrambleBtn">Scramble</button>
          </div>
        </div>

        <!-- History -->
        <div class="section">
          <div class="section-title">History</div>
          <div class="btn-group">
            <button class="btn btn-secondary" id="undoBtn">Undo</button>
            <button class="btn btn-secondary" id="redoBtn">Redo</button>
          </div>
          <button class="btn btn-secondary" id="resetBtn" style="width:100%;margin-top:6px">Reset</button>
        </div>

        <!-- Presets -->
        <div class="section">
          <div class="section-title">Presets</div>
          <div style="display:flex;gap:8px">
            <input id="presetName" type="text" placeholder="Preset name">
            <button class="btn" id="savePresetBtn">Save Preset</button>
          </div>
          <div style="margin-top:8px;display:flex;gap:8px">
            <select id="presetSelect"><option value="">— select preset —</option></select>
            <button class="btn btn-secondary" id="loadPresetBtn">Load</button>
            <button class="btn btn-danger" id="deletePresetBtn">Delete</button>
          </div>
          <div class="note">Presets store Intensity & Chunk Size and a snapshot of the audio state (limited history).</div>
        </div>

        <!-- Session -->
        <div class="section">
          <div class="section-title">Session</div>
          <div style="display:flex;gap:8px">
            <button class="btn" id="saveSessionBtn">Save Session Now</button>
            <button class="btn btn-secondary" id="clearSessionBtn">Clear Session</button>
          </div>
          <div class="note">Autosave occurs every 5s. On load you'll be offered to restore the last session.</div>
        </div>

      </div>

      <div class="panel-footer">
        <button class="footer-btn primary" id="playBtn">Play</button>
        <button class="footer-btn" id="stopBtn">Stop</button>
        <button class="footer-btn" id="exportBtn">Export</button>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <div class="header">
    <div id="duration">0.00s</div>
    <div style="margin-left:auto;font-size:11px;color:#666">DATABEND - Audio Destruction Tool</div>
  </div>
</div>

<script>
/* ======= Globals & DOM refs ======= */
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

const loadBtn = document.getElementById('loadBtn');
const playBtn = document.getElementById('playBtn');
const stopBtn = document.getElementById('stopBtn');
const exportBtn = document.getElementById('exportBtn');

const undoBtn = document.getElementById('undoBtn');
const redoBtn = document.getElementById('redoBtn');
const resetBtn = document.getElementById('resetBtn');

const bitcrushBtn = document.getElementById('bitcrushBtn');
const foldBtn = document.getElementById('foldBtn');
const shiftBtn = document.getElementById('shiftBtn');
const invertBtn = document.getElementById('invertBtn');
const randomBtn = document.getElementById('randomBtn');
const corruptBtn = document.getElementById('corruptBtn');

const granularBtn = document.getElementById('granularBtn');
const stutterBtn = document.getElementById('stutterBtn');
const reverseBtn = document.getElementById('reverseBtn');
const scrambleBtn = document.getElementById('scrambleBtn');

const intensityEl = document.getElementById('intensity');
const intensityVal = document.getElementById('intensityVal');
const chunkSizeEl = document.getElementById('chunkSize');

const statusEl = document.getElementById('status');
const fileInfoEl = document.getElementById('fileInfo');
const durationEl = document.getElementById('duration');

const savePresetBtn = document.getElementById('savePresetBtn');
const loadPresetBtn = document.getElementById('loadPresetBtn');
const deletePresetBtn = document.getElementById('deletePresetBtn');
const presetSelect = document.getElementById('presetSelect');
const presetNameEl = document.getElementById('presetName');

const saveSessionBtn = document.getElementById('saveSessionBtn');
const clearSessionBtn = document.getElementById('clearSessionBtn');

/* Progress DOM */
const glitchWrap = document.getElementById('glitchProgressWrap');
const glitchBox = document.getElementById('glitchProgress');
const progressBar = document.getElementById('progressBar');
const labelR = document.getElementById('labelR');
const labelG = document.getElementById('labelG');
const labelBase = document.getElementById('labelBase');
const progressFlash = document.getElementById('progressFlash');

/* ======= Audio state ======= */
let audioCtx = null;
let original = null;   // Float32Array
let current = null;    // Float32Array
let history = [];
let historyIndex = -1;
let playing = false;
let sourceNode = null;

/* ======= Autosave/Presets config ======= */
const SESSION_KEY = 'databend_session_v1';
const PRESETS_KEY = 'databend_presets_v1';
const AUTOSAVE_INTERVAL = 5000; // ms
const MAX_HISTORY_SAVE = 8;     // how many history states to serialize per session/preset

/* ======= Progress state ======= */
let progressState = {
  visible: false,
  mode: 'simulated', // 'measured' or 'simulated'
  fraction: 0,
  label: '',
  simAnim: null,
  charCount: 24, // will be recalculated on show
};

/* ======= Init ======= */
function init(){
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  resizeCanvas();
  window.addEventListener('resize', resizeCanvas);
  requestAnimationFrame(drawLoop);
  intensityEl.addEventListener('input', e => intensityVal.textContent = e.target.value);

  loadPresetsUI();
  // offer restore
  try {
    const sess = localStorage.getItem(SESSION_KEY);
    if(sess){
      if(confirm('Restore last session?')) restoreSession();
    }
  } catch(e){ console.warn('session read fail', e); }

  // autosave loop
  setInterval(() => {
    try { autosaveSession(); } catch(e) { console.warn('autosave fail', e); }
  }, AUTOSAVE_INTERVAL);
}
init();

/* ======= Helpers ======= */
function setStatus(text, ms = 1200){
  statusEl.textContent = text;
  if(ms > 0){
    clearTimeout(setStatus._t);
    setStatus._t = setTimeout(()=>{ if(statusEl.textContent === text) statusEl.textContent = 'Ready'; }, ms);
  }
}

function safeCopyFloat32(arr){
  return arr ? arr.slice() : null;
}

/* ======= File loading (measured progress via FileReader) ======= */
loadBtn.onclick = () => {
  const inp = document.createElement('input');
  inp.type = 'file';
  inp.accept = 'audio/*';
  inp.onchange = async (e) => {
    const file = e.target.files[0];
    if(!file) return;
    setStatus('Loading...');
    // show measured progress bar
    glitchProgressStart('Loading Audio…', 'measured');
    try{
      const reader = new FileReader();
      reader.onprogress = (ev) => {
        if(ev.lengthComputable){
          const fraction = ev.loaded / ev.total;
          glitchProgressUpdate(fraction, 'Loading Audio…');
        }
      };
      reader.onload = async (ev) => {
        try {
          const ab = ev.target.result;
          // ensure audioCtx resumed
          if(audioCtx.state === 'suspended') await audioCtx.resume();
          const decoded = await new Promise((resolve, reject) => {
            audioCtx.decodeAudioData(ab.slice(0), res => resolve(res), err => reject(err));
          });
          const ch = decoded.numberOfChannels;
          const len = decoded.length;
          const samp = new Float32Array(len);
          if(ch === 1) samp.set(decoded.getChannelData(0));
          else {
            const L = decoded.getChannelData(0);
            const R = decoded.getChannelData(1);
            for(let i = 0; i < len; i++) samp[i] = (L[i] + R[i]) * 0.5;
          }
          original = samp;
          current = samp.slice();
          history = [];
          historyIndex = -1;
          updateUI();
          setStatus('Loaded');
          saveState();
        } catch(err){
          console.error('decode error', err);
          setStatus('Error decoding', 2000);
        } finally {
          // ensure progress reaches 100% visually
          glitchProgressUpdate(1, 'Loading Audio…');
          setTimeout(() => glitchProgressEnd(true), 260);
        }
      };
      reader.onerror = (err) => {
        console.error('read error', err);
        setStatus('Read error', 2000);
        glitchProgressEnd(false);
      };
      reader.readAsArrayBuffer(file);
    } catch(err){
      console.error('load error', err);
      setStatus('Error loading', 2000);
      glitchProgressEnd(false);
    }
  };
  inp.click();
};

function updateUI(){
  if(!current) {
    durationEl.textContent = '0.00s';
    fileInfoEl.textContent = 'No file loaded';
    return;
  }
  const dur = (current.length / audioCtx.sampleRate).toFixed(2);
  durationEl.textContent = dur + 's';
  fileInfoEl.textContent = `${(current.length / 1000).toFixed(0)}k samples`;
}

/* ======= Conversions (stable) ======= */
function f32ToInt16Buffer(float32){
  const buf = new ArrayBuffer(float32.length * 2);
  const dv = new DataView(buf);
  let o = 0;
  for(let i = 0; i < float32.length; i++){
    let v = Math.max(-1, Math.min(1, float32[i]));
    dv.setInt16(o, v < 0 ? v * 0x8000 : v * 0x7FFF, true);
    o += 2;
  }
  return buf;
}

function int16BufferToF32(buf){
  const dv = new DataView(buf);
  const len = dv.byteLength / 2;
  const out = new Float32Array(len);
  let o = 0;
  for(let i = 0; i < len; i++){
    out[i] = dv.getInt16(o, true) / 0x7FFF;
    o += 2;
  }
  return out;
}

/* ======= Base64 helpers for session storage ======= */
function float32ToBase64PCM(float32){
  const pcmBuf = f32ToInt16Buffer(float32);
  const u8 = new Uint8Array(pcmBuf);
  let CHUNK = 0x8000;
  let binary = '';
  for (let i = 0; i < u8.length; i += CHUNK) {
    const slice = u8.subarray(i, i + CHUNK);
    binary += String.fromCharCode.apply(null, slice);
  }
  return btoa(binary);
}

function base64PCMToFloat32(b64){
  const bin = atob(b64);
  const len = bin.length;
  const u8 = new Uint8Array(len);
  for(let i = 0; i < len; i++) u8[i] = bin.charCodeAt(i);
  return int16BufferToF32(u8.buffer);
}

/* ======= History / State ======= */
function saveState(){
  if(!current) return;
  history = history.slice(0, historyIndex + 1);
  history.push(current.slice());
  historyIndex++;
  if(history.length > 40){
    history.shift();
    historyIndex--;
  }
  setStatus('Saved', 700);
}

undoBtn.onclick = () => {
  if(historyIndex > 0){
    historyIndex--;
    current = history[historyIndex].slice();
    updateUI();
    setStatus('Undo');
  } else {
    setStatus('Nothing to undo', 600);
  }
};

redoBtn.onclick = () => {
  if(historyIndex < history.length - 1){
    historyIndex++;
    current = history[historyIndex].slice();
    updateUI();
    setStatus('Redo');
  } else {
    setStatus('Nothing to redo', 600);
  }
};

resetBtn.onclick = () => {
  if(!original) return setStatus('No file', 800);
  if(confirm('Reset to original?')){
    current = original.slice();
    history = [];
    historyIndex = -1;
    updateUI();
    setStatus('Reset');
    saveState();
  }
};

/* ======= Glitch progress functions (text-driven adaptive bar) ======= */

function computeCharCount() {
  // estimate char width for monospace and fill entire visible width
  const wrap = glitchBox;
  const style = window.getComputedStyle(wrap);
  const innerWidth = wrap.clientWidth - 120; // leave space for text & padding
  const approxCharPx = 10; // good compromise; monospace font
  return Math.max(12, Math.floor(innerWidth / approxCharPx));
}

function buildBarString(frac, totalChars) {
  const filled = Math.round(frac * totalChars);
  const empty = Math.max(0, totalChars - filled);
  return '█'.repeat(filled) + '▒'.repeat(empty);
}

function setLabelText(label) {
  label = label || '';
  labelR.textContent = label;
  labelG.textContent = label;
  labelBase.textContent = label;
}

function renderProgress() {
  // adaptive char count
  progressState.charCount = computeCharCount();
  const s = buildBarString(progressState.fraction, progressState.charCount);
  progressBar.textContent = s;
  // center text label - keep it short
  setLabelText(progressState.label);
}

/**
 * Show glitch progress
 * mode: 'measured' or 'simulated'
 */
function glitchProgressStart(label = 'Processing…', mode = 'simulated', opts = {}) {
  // cancel any existing simulated anim
  if(progressState.simAnim) {
    cancelAnimationFrame(progressState.simAnim);
    progressState.simAnim = null;
  }
  progressState.visible = true;
  progressState.mode = mode;
  progressState.fraction = 0;
  progressState.label = label;
  glitchBox.classList.add('show', 'active');
  // initial render
  renderProgress();
  // if simulated mode with duration, animate smoothly
  if(mode === 'simulated') {
    const duration = opts.duration || 1200;
    const start = performance.now();
    function tick(now) {
      const t = now - start;
      const frac = Math.min(1, t / duration);
      // ease-out for nicer feel
      progressState.fraction = frac < 1 ? (1 - Math.pow(1 - frac, 2)) : 1;
      renderProgress();
      if(progressState.fraction < 1) {
        progressState.simAnim = requestAnimationFrame(tick);
      } else {
        // stay visible for a tiny moment; caller should call glitchProgressEnd to finalize
        progressState.simAnim = null;
      }
    }
    progressState.simAnim = requestAnimationFrame(tick);
  }
}

function glitchProgressUpdate(fraction, label) {
  progressState.mode = 'measured';
  progressState.fraction = Math.max(0, Math.min(1, fraction || 0));
  if(label) progressState.label = label;
  renderProgress();
  // subtle active animation
  glitchBox.classList.add('active');
}

function flashAndHide() {
  progressFlash.style.display = 'block';
  progressFlash.style.background = 'rgba(255,255,255,0.0)';
  progressFlash.style.transition = 'none';
  requestAnimationFrame(() => {
    progressFlash.style.transition = 'background 160ms ease-out, opacity 320ms ease-out';
    progressFlash.style.background = 'rgba(255,255,255,0.75)';
    progressFlash.style.opacity = '1';
    setTimeout(()=> {
      progressFlash.style.background = 'rgba(255,255,255,0.0)';
      progressFlash.style.opacity = '0';
      setTimeout(()=> {
        progressFlash.style.display = 'none';
        glitchBox.classList.remove('show','active');
      }, 260);
    }, 120);
  });
}

function glitchProgressEnd(success = true) {
  // ensure fraction is 1
  progressState.fraction = 1;
  renderProgress();
  // flash and hide
  setTimeout(()=> flashAndHide(), 80);
}

/* ======= Core applybend wrapper (now async-friendly for progress animation) ======= */
function applybend(fn, options = { previewIntensity: null, previewDuration: 900 }){
  if(!current) {
    setStatus('Load a file first', 800);
    return;
  }
  saveState();
  const intensity = options.previewIntensity !== null ? options.previewIntensity : parseInt(intensityEl.value);
  const duration = options.previewDuration || 900;

  // show simulated progress
  glitchProgressStart('Processing Databend…', 'simulated', { duration });

  // perform the heavy mutation asynchronously so UI can animate the progress
  setTimeout(() => {
    const buf = f32ToInt16Buffer(current);    // ArrayBuffer
    const dv = new DataView(buf);
    try {
      fn(dv);
    } catch(err) {
      console.error('applybend error', err);
    }
    current = int16BufferToF32(buf);
    updateUI();

    // finalize progress
    setTimeout(()=> glitchProgressEnd(true), Math.max(120, duration - 80));
  }, 16);
}

/* ======= Databend operations ======= */
bitcrushBtn.onclick = () => {
  const intensity = parseInt(intensityEl.value);
  const bits = Math.max(1, 16 - Math.floor(intensity / 6));
  applybend(dv => {
    const mask = (0xFFFF << (16 - bits)) & 0xFFFF;
    for(let i = 0; i < dv.byteLength; i += 2){
      const v = dv.getInt16(i, true);
      dv.setInt16(i, v & mask, true);
    }
  }, { previewIntensity: intensity, previewDuration: 900 });
};

foldBtn.onclick = () => {
  const intensity = parseInt(intensityEl.value);
  const folds = Math.max(1, Math.floor(intensity / 10));
  applybend(dv => {
    for(let i = 0; i < dv.byteLength; i += 2){
      let v = dv.getInt16(i, true);
      for(let f = 0; f < folds; f++){
        if(v > 0) v = 0x7FFF - v;
        else v = -0x8000 - v;
      }
      dv.setInt16(i, v, true);
    }
  }, { previewIntensity: intensity, previewDuration: 1100 });
};

shiftBtn.onclick = () => {
  const intensity = parseInt(intensityEl.value);
  const shift = Math.floor(intensity / 5);
  applybend(dv => {
    for(let i = 0; i < dv.byteLength; i += 2){
      let v = dv.getInt16(i, true);
      v = Math.max(-0x8000, Math.min(0x7FFF, v << shift));
      dv.setInt16(i, v, true);
    }
  }, { previewIntensity: intensity, previewDuration: 800 });
};

invertBtn.onclick = () => {
  const intensity = parseInt(intensityEl.value);
  applybend(dv => {
    const arr = new Uint8Array(dv.buffer);
    const chance = intensity / 100;
    for(let i = 0; i < arr.length; i++){
      if(Math.random() < chance) arr[i] = (~arr[i]) & 0xFF;
    }
  }, { previewIntensity: intensity, previewDuration: 700 });
};

randomBtn.onclick = () => {
  const intensity = parseInt(intensityEl.value);
  applybend(dv => {
    const chance = intensity / 100;
    for(let i = 0; i < dv.byteLength; i++){
      if(Math.random() < chance) dv.setUint8(i, Math.floor(Math.random() * 256));
    }
  }, { previewIntensity: intensity, previewDuration: 650 });
};

corruptBtn.onclick = () => {
  const intensity = parseInt(intensityEl.value);
  applybend(dv => {
    const numCorrupt = Math.floor((dv.byteLength / 100) * intensity);
    for(let i = 0; i < numCorrupt; i++){
      const idx = Math.floor(Math.random() * dv.byteLength);
      dv.setUint8(idx, Math.floor(Math.random() * 256));
    }
  }, { previewIntensity: intensity, previewDuration: 1200 });
};

/* ======= Glitch ops (use applybend for visual consistency) ======= */
granularBtn.onclick = () => {
  if(!current) return setStatus('Load a file first', 800);
  saveState();
  const chunk = Math.max(4, parseInt(chunkSizeEl.value) || 512);
  // simulate via applybend to show progress nicely
  applybend(() => {
    const out = new Float32Array(current.length);
    const chunks = Math.max(1, Math.floor(current.length / chunk));
    for(let i = 0; i < current.length; i++){
      const gIdx = Math.floor(Math.random() * chunks) * chunk;
      out[i] = current[Math.min(gIdx + (i % chunk), current.length - 1)];
    }
    current = out;
  }, { previewDuration: 900 });
  saveState();
};

stutterBtn.onclick = () => {
  if(!current) return setStatus('Load a file first', 800);
  saveState();
  const chunk = Math.max(4, parseInt(chunkSizeEl.value) || 512);
  applybend(() => {
    const out = new Float32Array(current.length);
    for(let i = 0; i < current.length; i++){
      const chunkIdx = Math.floor(i / chunk);
      const pos = i % chunk;
      out[i] = current[Math.min(chunkIdx * chunk + pos, current.length - 1)];
    }
    current = out;
  }, { previewDuration: 700 });
  saveState();
};

reverseBtn.onclick = () => {
  if(!current) return setStatus('Load a file first', 800);
  saveState();
  applybend(() => {
    current.reverse();
  }, { previewDuration: 420 });
  saveState();
};

scrambleBtn.onclick = () => {
  if(!current) return setStatus('Load a file first', 800);
  saveState();
  applybend(() => {
    const chunk = Math.max(4, parseInt(chunkSizeEl.value) || 512);
    const out = current.slice();
    for(let i = 0; i < out.length; i += chunk){
      const end = Math.min(i + chunk, out.length);
      const section = out.slice(i, end);
      for(let j = section.length - 1; j > 0; j--){
        const k = Math.floor(Math.random() * (j + 1));
        [section[j], section[k]] = [section[k], section[j]];
      }
      out.set(section, i);
    }
    current = out;
  }, { previewDuration: 950 });
  saveState();
};

/* ======= Playback ======= */
async function play(){
  if(!current) return setStatus('Load a file first', 1000);
  if(sourceNode){
    try{ sourceNode.stop(); } catch(e) {}
    sourceNode.disconnect();
    sourceNode = null;
  }
  if(audioCtx.state === 'suspended') await audioCtx.resume();
  const buf = audioCtx.createBuffer(1, current.length, audioCtx.sampleRate);
  const channel = buf.getChannelData(0);
  for(let i = 0; i < current.length; i++){
    const s = Math.max(-0.99, Math.min(0.99, current[i]));
    channel[i] = s;
  }
  sourceNode = audioCtx.createBufferSource();
  sourceNode.buffer = buf;
  sourceNode.connect(audioCtx.destination);
  sourceNode.onended = () => {
    playing = false;
    playBtn.textContent = 'Play';
    setStatus('Playback ended');
  };
  sourceNode.start(0);
  playing = true;
  playBtn.textContent = 'Playing...';
  setStatus('Playing', 800);
}

function stop(){
  if(sourceNode){
    try{ sourceNode.stop(); } catch(e) {}
    sourceNode.disconnect();
    sourceNode = null;
  }
  playing = false;
  playBtn.textContent = 'Play';
  setStatus('Stopped', 600);
}

playBtn.onclick = () => { if(!playing) play(); else { stop(); } };
stopBtn.onclick = stop;

/* ======= Export (simulated progress) ======= */
exportBtn.onclick = () => {
  if(!current) return setStatus('Load a file first', 800);

  glitchProgressStart('Exporting File…', 'simulated', { duration: 1200 });

  // let the progress animate; create and download after a short delay so animation can run
  setTimeout(() => {
    try {
      const wav = writeWAV(current, audioCtx.sampleRate);
      const url = URL.createObjectURL(wav);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'databend.wav';
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
      setStatus('Exported', 1000);
      glitchProgressEnd(true);
    } catch(e) {
      console.error('export error', e);
      setStatus('Export failed', 1200);
      glitchProgressEnd(false);
    }
  }, 380); // small delay so user sees a bit of animation
};

/* ======= WAV helpers ======= */
function floatTo16(arr){
  const buf = new ArrayBuffer(arr.length*2);
  const dv = new DataView(buf);
  let o = 0;
  for(let i = 0; i < arr.length; i++){
    let s = Math.max(-1, Math.min(1, arr[i]));
    dv.setInt16(o, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
    o += 2;
  }
  return buf;
}

function writeWAV(float32Array, sr){
  const wavBuffer = floatTo16(float32Array);
  const buffer = new ArrayBuffer(44 + wavBuffer.byteLength);
  const view = new DataView(buffer);
  const writeString = (offset, string) => {
    for(let i = 0; i < string.length; i++){
      view.setUint8(offset + i, string.charCodeAt(i));
    }
  };
  writeString(0, 'RIFF');
  view.setUint32(4, 36 + wavBuffer.byteLength, true);
  writeString(8, 'WAVE');
  writeString(12, 'fmt ');
  view.setUint32(16, 16, true);
  view.setUint16(20, 1, true);
  view.setUint16(22, 1, true);
  view.setUint32(24, sr, true);
  view.setUint32(28, sr * 2, true);
  view.setUint16(32, 2, true);
  view.setUint16(34, 16, true);
  writeString(36, 'data');
  view.setUint32(40, wavBuffer.byteLength, true);
  const pcmView = new Uint8Array(wavBuffer);
  for(let i = 0; i < pcmView.length; i++){
    view.setUint8(44 + i, pcmView[i]);
  }
  return new Blob([view], {type:'audio/wav'});
}

/* ======= Drawing waveform ======= */
function resizeCanvas(){
  ctx.setTransform(1,0,0,1,0,0);
  canvas.width = canvas.offsetWidth * devicePixelRatio;
  canvas.height = canvas.offsetHeight * devicePixelRatio;
  ctx.scale(devicePixelRatio, devicePixelRatio);
  // ensure progress bar width adapts
  renderProgress();
}

let lastDrawTime = 0;
function drawLoop(ts){
  if(!lastDrawTime || ts - lastDrawTime > 16){
    drawWaveform();
    lastDrawTime = ts;
  }
  requestAnimationFrame(drawLoop);
}

function drawWaveform(){
  const w = canvas.width / devicePixelRatio;
  const h = canvas.height / devicePixelRatio;
  ctx.clearRect(0,0,w,h);
  ctx.fillStyle = '#0a0a0a';
  ctx.fillRect(0,0,w,h);
  if(!current) return;
  ctx.strokeStyle = '#0d7377';
  ctx.lineWidth = 1;
  const step = Math.max(1, Math.floor(current.length / w));
  for(let x = 0; x < w; x++){
    const i = Math.floor((x * current.length) / w);
    let min = 1, max = -1;
    for(let j = 0; j < step && i + j < current.length; j++){
      const v = current[i + j];
      if(v < min) min = v;
      if(v > max) max = v;
    }
    const y1 = ((max + 1) / 2) * h;
    const y2 = ((min + 1) / 2) * h;
    ctx.fillStyle = '#0d7377';
    ctx.fillRect(x, y1, 1, Math.max(1, y2 - y1));
  }
}

/* ======= Keyboard shortcuts ======= */
document.addEventListener('keydown', async (e) => {
  if(e.code === 'Space') e.preventDefault();

  const isMac = navigator.platform.toUpperCase().indexOf('MAC') >= 0;
  const cmd = isMac ? e.metaKey : e.ctrlKey;
  if (cmd && e.key.toLowerCase() === 'z') { undoBtn.click(); return; }
  if (cmd && e.key.toLowerCase() === 'y') { redoBtn.click(); return; }
  if (cmd && (e.key.toLowerCase() === 's')) { e.preventDefault(); exportBtn.click(); return; }
  if (e.code === 'Space') { if (playing) stop(); else await play(); return; }
});

/* ======= Session Autosave & Presets ======= */
function makeSessionObject(){
  const obj = {
    ts: Date.now(),
    intensity: parseInt(intensityEl.value),
    chunkSize: parseInt(chunkSizeEl.value) || 512,
    historyIndex,
    historyCount: history.length,
    historySnapshots: []
  };
  const start = Math.max(0, history.length - MAX_HISTORY_SAVE);
  for(let i = start; i < history.length; i++){
    try{ obj.historySnapshots.push(float32ToBase64PCM(history[i])); } catch(e){ console.warn('history snapshot encode fail', e); }
  }
  if(history.length === 0 && current){
    try{ obj.historySnapshots.push(float32ToBase64PCM(current)); obj.historyIndex = 0; } catch(e){ console.warn('current encode fail', e); }
  }
  return obj;
}

function autosaveSession(){
  try {
    const obj = makeSessionObject();
    localStorage.setItem(SESSION_KEY, JSON.stringify(obj));
    setStatus('Session saved', 400);
  } catch(e){ console.warn('autosave error', e); }
}

saveSessionBtn.onclick = () => {
  try {
    const obj = makeSessionObject();
    localStorage.setItem(SESSION_KEY, JSON.stringify(obj));
    setStatus('Session saved', 700);
  } catch(e){ console.warn('session save fail', e); setStatus('Save failed', 700); }
};

clearSessionBtn.onclick = () => {
  if(confirm('Clear saved session?')){
    localStorage.removeItem(SESSION_KEY);
    setStatus('Session cleared', 700);
  }
};

function restoreSession(){
  try {
    const raw = localStorage.getItem(SESSION_KEY);
    if(!raw) { setStatus('No session found', 600); return; }
    const obj = JSON.parse(raw);
    intensityEl.value = obj.intensity || 50;
    intensityVal.textContent = intensityEl.value;
    chunkSizeEl.value = obj.chunkSize || 512;
    if(Array.isArray(obj.historySnapshots) && obj.historySnapshots.length > 0){
      try {
        const first = base64PCMToFloat32(obj.historySnapshots[0]);
        current = first.slice();
        original = current.slice();
        history = [current.slice()];
        historyIndex = 0;
        updateUI();
        setStatus('Session restored', 800);
      } catch(e){ console.warn('restore decode fail', e); setStatus('Partial restore', 800); }
    } else {
      setStatus('Session restored (no audio)', 700);
    }
  } catch(e){ console.warn('restore fail', e); setStatus('Restore failed', 1000); }
}

/* ======= Presets: store UI values and a snapshot (small history) ======= */
function loadPresetsUI(){
  try {
    const raw = localStorage.getItem(PRESETS_KEY);
    const obj = raw ? JSON.parse(raw) : {};
    presetSelect.innerHTML = '<option value="">— select preset —</option>';
    for(const key in obj){
      const opt = document.createElement('option');
      opt.value = key;
      opt.textContent = key;
      presetSelect.appendChild(opt);
    }
  } catch(e){ console.warn('load presets fail', e); }
}

savePresetBtn.onclick = () => {
  const name = (presetNameEl.value || '').trim();
  if(!name) return alert('Enter a preset name');
  try {
    const raw = localStorage.getItem(PRESETS_KEY);
    const presets = raw ? JSON.parse(raw) : {};
    const preset = {
      ts: Date.now(),
      intensity: parseInt(intensityEl.value),
      chunkSize: parseInt(chunkSizeEl.value) || 512,
      audioSnapshot: null
    };
    if(current){
      try { preset.audioSnapshot = float32ToBase64PCM(current); } catch(e){ console.warn('preset audio encode fail', e); }
    }
    presets[name] = preset;
    localStorage.setItem(PRESETS_KEY, JSON.stringify(presets));
    loadPresetsUI();
    presetSelect.value = name;
    presetNameEl.value = '';
    setStatus('Preset saved', 800);
  } catch(e){ console.warn('save preset fail', e); setStatus('Save failed', 800); }
};

loadPresetBtn.onclick = () => {
  const key = presetSelect.value;
  if(!key) return setStatus('Select a preset', 800);
  try {
    const raw = localStorage.getItem(PRESETS_KEY);
    const presets = raw ? JSON.parse(raw) : {};
    const preset = presets[key];
    if(!preset) return setStatus('Preset not found', 800);
    intensityEl.value = preset.intensity || 50;
    intensityVal.textContent = intensityEl.value;
    chunkSizeEl.value = preset.chunkSize || 512;
    if(preset.audioSnapshot){
      try {
        const f = base64PCMToFloat32(preset.audioSnapshot);
        current = f.slice();
        original = current.slice();
        history = [current.slice()];
        historyIndex = 0;
        updateUI();
      } catch(e){ console.warn('preset decode fail', e); }
    }
    setStatus('Preset loaded', 900);
  } catch(e){ console.warn('load preset fail', e); setStatus('Load failed', 900); }
};

deletePresetBtn.onclick = () => {
  const key = presetSelect.value;
  if(!key) return setStatus('Select a preset', 800);
  if(!confirm(`Delete preset "${key}"?`)) return;
  try {
    const raw = localStorage.getItem(PRESETS_KEY);
    const presets = raw ? JSON.parse(raw) : {};
    delete presets[key];
    localStorage.setItem(PRESETS_KEY, JSON.stringify(presets));
    loadPresetsUI();
    setStatus('Preset deleted', 700);
  } catch(e){ console.warn('delete preset fail', e); setStatus('Delete failed', 700); }
};

/* ======= Clean up on unload: autosave one last time ======= */
window.addEventListener('beforeunload', () => {
  try { autosaveSession(); } catch(e) {}
});
